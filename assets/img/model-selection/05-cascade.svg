<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 852" width="960" height="852" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="960" height="852" fill="#fbfcfc"></rect><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a555a"></path></marker></defs><rect x="330" y="30" width="280" height="46" rx="3" fill="#fbfcfc" stroke="#c9d2d1" stroke-width="1.5"></rect><text x="470" y="57" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="500">1. Task to do</text><path d="M 470 76 L 470 104" stroke="#4a555a" stroke-width="1.5" fill="none" marker-end="url(#ar)"></path><rect x="280" y="104" width="380" height="46" rx="3" fill="#fbfcfc" stroke="#c9d2d1" stroke-width="1.5"></rect><text x="470" y="131" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="500">2. Find its cluster in the table</text><path d="M 470 150 L 470 178" stroke="#4a555a" stroke-width="1.5" fill="none" marker-end="url(#ar)"></path><path d="M 470 181 L 650 226 L 470 271 L 290 226 Z" fill="#fff7ec" stroke="#eb6834" stroke-width="2"></path><text x="470" y="221.75" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="600">3. Can this cluster run on</text><text x="470" y="238.25" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="600">the self-hosted platform?</text><path d="M 290 226 L 274 226" stroke="#4a555a" stroke-width="1.5" fill="none" marker-end="url(#ar)"></path><text x="300" y="218" fill="#4a555a" font-size="11" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500">yes</text><rect x="20" y="194" width="250" height="64" rx="3" fill="#eef3fb" stroke="#2a78d6" stroke-width="2"></rect><text x="145" y="221.75" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="600">4a. Use the self-hosted</text><text x="145" y="238.25" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="600">platform</text><path d="M 145 258 L 145 378 L 456 378" stroke="#4a555a" stroke-width="1.5" fill="none" marker-end="url(#ar)"></path><path d="M 470 271 L 470 300" stroke="#4a555a" stroke-width="1.5" fill="none" marker-end="url(#ar)"></path><text x="488" y="288" fill="#4a555a" font-size="11" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500">no</text><rect x="220" y="300" width="500" height="60" rx="3" fill="#eef3fb" stroke="#2a78d6" stroke-width="2"></rect><text x="470" y="325.75" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="600">4b. Run the cluster's starting model,</text><text x="470" y="342.25" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="600">with a strict output schema where possible</text><path d="M 470 360 L 470 394" stroke="#4a555a" stroke-width="1.5" fill="none" marker-end="url(#ar)"></path><path d="M 470 394 L 620 442 L 470 490 L 320 442 Z" fill="#fff7ec" stroke="#eb6834" stroke-width="2"></path><text x="470" y="437.75" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="600">5. Does the automatic</text><text x="470" y="454.25" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="600">check pass?</text><path d="M 320 442 L 274 442" stroke="#4a555a" stroke-width="1.5" fill="none" marker-end="url(#ar)"></path><text x="300" y="434" fill="#4a555a" font-size="11" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500">yes</text><rect x="20" y="412" width="250" height="60" rx="3" fill="#fbfcfc" stroke="#c9d2d1" stroke-width="1.5"></rect><text x="145" y="437.75" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="500">Done. Log tokens,</text><text x="145" y="454.25" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="500">cost and outcome</text><path d="M 470 490 L 470 526" stroke="#4a555a" stroke-width="1.5" fill="none" marker-end="url(#ar)"></path><text x="488" y="512" fill="#4a555a" font-size="11" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500">no</text><path d="M 470 529 L 615 574 L 470 619 L 325 574 Z" fill="#fff7ec" stroke="#eb6834" stroke-width="2"></path><text x="470" y="569.75" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="600">6. Was this the</text><text x="470" y="586.25" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="600">first attempt?</text><path d="M 615 574 L 686 574" stroke="#4a555a" stroke-width="1.5" fill="none" marker-end="url(#ar)"></path><text x="660" y="566" fill="#4a555a" font-size="11" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500">yes</text><rect x="690" y="544" width="250" height="60" rx="3" fill="#fbfcfc" stroke="#c9d2d1" stroke-width="1.5"></rect><text x="815" y="569.75" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="500">7. Move to the cluster's</text><text x="815" y="586.25" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="500">escalation model</text><path d="M 815 544 L 815 330 L 724 330" stroke="#4a555a" stroke-width="1.5" fill="none" marker-end="url(#ar)"></path><text x="805" y="440" fill="#4a555a" font-size="11" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500">retry</text><path d="M 470 619 L 470 658" stroke="#4a555a" stroke-width="1.5" fill="none" marker-end="url(#ar)"></path><text x="488" y="644" fill="#4a555a" font-size="11" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500">no</text><rect x="240" y="658" width="460" height="60" rx="3" fill="#fbfcfc" stroke="#c9d2d1" stroke-width="1.5"></rect><text x="470" y="683.75" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="500">8. Stop. Hand the case to a person</text><text x="470" y="700.25" fill="#0e1417" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="500">and add it to the evaluation set</text><rect x="20" y="748" width="920" height="76" rx="3" fill="#eef3f6" stroke="#c9d2d1" stroke-width="1"></rect><text x="480" y="774.5" fill="#4a555a" font-size="11.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="500">WEEKLY CHECK</text><text x="480" y="790" fill="#4a555a" font-size="11.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="500">Escalation rate above 30%: the starting model is too weak. Below 5%: try one tier cheaper.</text><text x="480" y="805.5" fill="#4a555a" font-size="11.5" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="500">Frontier tier only with an explicit, recorded reason.</text></svg>